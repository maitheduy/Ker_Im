<script>
const questions = [
  // ===== 3 LÝ THUYẾT =====
  {
    category: 'theory', tag: 'Lý thuyết', tagClass: 'tag-theory',
    text: 'Kernel (hay Null space) của ma trận \\(A\\), ký hiệu \\(\\ker(A)\\), được định nghĩa là:',
    options: [
      'Tập hợp các vector \\(\\mathbf{x}\\) sao cho \\(A\\mathbf{x} = \\mathbf{0}\\)',
      'Tập hợp các vector \\(\\mathbf{x}\\) sao cho \\(A\\mathbf{x} = \\mathbf{x}\\)',
      'Tập hợp tất cả các vector cột của \\(A\\)',
      'Tập hợp các vector riêng của \\(A\\)'

    answer: 0,
    explain: '<strong>Định nghĩa:</strong> \\(\\ker(A) = \\{\\mathbf{x} \\mid A\\mathbf{x} = \\mathbf{0}\\}\\). Đây là tập các vector bị ma trận \\(A\\) "biến thành" vector \\(\\mathbf{0}\\). Một số sách ký hiệu là \\(\\text{Null}(A)\\) — đều cùng một khái niệm.'
  },
  {
    category: 'theory', tag: 'Lý thuyết', tagClass: 'tag-theory',
    text: 'Image của ma trận \\(A\\), ký hiệu \\(\\text{Im}(A)\\), được xác định như thế nào khi đã có ma trận bậc thang rút gọn (RREF)?',
    options: [
      'Là \\(\\text{span}\\) của các vector cột ở ma trận RREF tương ứng các cột chứa pivot',
      'Là \\(\\text{span}\\) của các vector cột ở ma trận \\(A\\) ban đầu tương ứng các cột chứa pivot',
      'Là \\(\\text{span}\\) của tất cả các vector cột của \\(A\\)',
      'Là \\(\\text{span}\\) của các vector hàng của RREF'
    ],
    answer: 1,
    explain: '<strong>Chú ý quan trọng:</strong> \\(\\text{Im}(A)\\) được sinh bởi các cột của <em>ma trận \\(A\\) ban đầu</em> (chứ không phải RREF), tại các vị trí cột chứa pivot. Các phép biến đổi hàng làm thay đổi không gian cột!'
  },
  {
    category: 'theory', tag: 'Lý thuyết', tagClass: 'tag-theory',
    text: 'Định lý Rank–Nullity phát biểu rằng, với ma trận \\(A\\) có \\(n\\) cột:',
    options: [
      '\\(\\dim(\\ker A) \\times \\dim(\\text{Im}\\, A) = n\\)',
      '\\(\\dim(\\ker A) + \\dim(\\text{Im}\\, A) = n\\)',
      '\\(\\dim(\\ker A) - \\dim(\\text{Im}\\, A) = n\\)',
      '\\(\\dim(\\ker A) + \\dim(\\text{Im}\\, A) = \\) số hàng của \\(A\\)'
    ],
    answer: 1,
    explain: '<strong>Định lý Rank–Nullity:</strong> \\(\\dim(\\ker A) + \\dim(\\text{Im}\\, A) = n\\) (số cột). Trong ví dụ bài giảng: \\(2 + 3 = 5\\) cột. Đây là một trong những định lý đẹp nhất của đại số tuyến tính!'
  },

  // ===== 5 BÀI TẬP DỄ =====
  {
    category: 'easy', tag: 'Dễ', tagClass: 'tag-easy',
    text: 'Cho ma trận \\(A = \\begin{bmatrix} 1 & 2 & 3 \\\\ 0 & 1 & 4 \\end{bmatrix}\\). Số chiều của \\(\\text{Im}(A)\\) bằng bao nhiêu?',
    options: ['1', '2', '3', '0'],
    answer: 1,
    explain: 'Ma trận đã ở dạng bậc thang, có 2 pivot (ở cột 1 và cột 2). Vậy \\(\\text{rank}(A) = \\dim(\\text{Im}\\, A) = 2\\).'
  },
  {
    category: 'easy', tag: 'Dễ', tagClass: 'tag-easy',
    text: 'Trong quá trình Gauss–Jordan, "pivot number" của một hàng được hiểu là:',
    options: [
      'Phần tử cuối cùng khác 0 của hàng',
      'Phần tử đầu tiên khác 0 (tính từ trái sang) của hàng',
      'Phần tử lớn nhất của hàng',
      'Phần tử ở đường chéo chính'
    ],
    answer: 1,
    explain: 'Pivot number là phần tử <strong>đầu tiên khác 0</strong> (từ trái sang) trên hàng đó. Trong RREF, mỗi pivot phải bằng \\(1\\) và là số khác 0 duy nhất trên cột của nó.'
  },
  {
    category: 'easy', tag: 'Dễ', tagClass: 'tag-easy',
    text: 'Ma trận \\(A\\) có kích thước \\(3 \\times 5\\), \\(\\text{rank}(A) = 2\\). Hỏi \\(\\dim(\\ker A)\\) bằng bao nhiêu?',
    options: ['2', '3', '5', '1'],
    answer: 1,
    explain: 'Theo Rank–Nullity: \\(\\dim(\\ker A) = n - \\text{rank}(A) = 5 - 2 = 3\\). Vậy \\(\\ker(A)\\) có 3 biến tự do.'
  },
  {
    category: 'easy', tag: 'Dễ', tagClass: 'tag-easy',
    text: 'Cho RREF của \\(A\\) là \\(\\begin{bmatrix} 1 & 0 & 2 \\\\ 0 & 1 & -1 \\\\ 0 & 0 & 0 \\end{bmatrix}\\). Biến tự do của hệ \\(A\\mathbf{x} = \\mathbf{0}\\) là:',
    options: ['\\(x_1\\)', '\\(x_2\\)', '\\(x_3\\)', 'Không có biến tự do'],
    answer: 2,
    explain: 'Pivot ở cột 1 và 2 → \\(x_1, x_2\\) là biến cơ sở. Cột 3 không có pivot → \\(x_3\\) là biến tự do. Vậy \\(\\dim(\\ker A) = 1\\).'
  },
  {
    category: 'easy', tag: 'Dễ', tagClass: 'tag-easy',
    text: 'Phép biến đổi sơ cấp nào <strong>bảo toàn</strong> \\(\\ker(A)\\)?',
    options: [
      'Nhân một hàng với số khác 0',
      'Đổi chỗ hai hàng',
      'Cộng một hàng với bội của hàng khác',
      'Tất cả các phép biến đổi hàng sơ cấp đều bảo toàn \\(\\ker(A)\\)'
    ],
    answer: 3,
    explain: 'Các phép biến đổi hàng sơ cấp <strong>bảo toàn \\(\\ker(A)\\)</strong> (vì nghiệm của \\(A\\mathbf{x}=\\mathbf{0}\\) không đổi). Tuy nhiên, chúng <strong>không bảo toàn \\(\\text{Im}(A)\\) theo từng vector cột</strong> — đó là lý do ta phải lấy cột pivot từ ma trận \\(A\\) <em>ban đầu</em>.'
  },

  // ===== 3 BÀI TẬP TRUNG BÌNH =====
  {
    category: 'medium', tag: 'Trung bình', tagClass: 'tag-medium',
    text: 'Cho \\(A = \\begin{bmatrix} 1 & 2 & 3 \\\\ 2 & 4 & 6 \\\\ 1 & 1 & 1 \\end{bmatrix}\\). Tìm \\(\\dim(\\ker A)\\) và \\(\\dim(\\text{Im}\\, A)\\).',
    options: [
      '\\(\\dim(\\ker)=0,\\; \\dim(\\text{Im})=3\\)',
      '\\(\\dim(\\ker)=1,\\; \\dim(\\text{Im})=2\\)',
      '\\(\\dim(\\ker)=2,\\; \\dim(\\text{Im})=1\\)',
      '\\(\\dim(\\ker)=3,\\; \\dim(\\text{Im})=0\\)'
    ],
    answer: 1,
    explain: 'Hàng 2 = \\(2 \\times\\) hàng 1 → phụ thuộc tuyến tính. RREF có 2 pivot (cột 1, cột 2). Vậy \\(\\text{rank} = 2\\), \\(\\dim(\\text{Im}) = 2\\), \\(\\dim(\\ker) = 3 - 2 = 1\\).'
  },
  {
    category: 'medium', tag: 'Trung bình', tagClass: 'tag-medium',
    text: 'Cho \\(A = \\begin{bmatrix} 1 & 0 & 2 \\\\ 0 & 1 & -3 \\end{bmatrix}\\) đã là RREF. Một vector cơ sở của \\(\\ker(A)\\) là:',
    options: [
      '\\(\\begin{bmatrix} 2 \\\\ -3 \\\\ 1 \\end{bmatrix}\\)',
      '\\(\\begin{bmatrix} 2 \\\\ 3 \\\\ 1 \\end{bmatrix}\\)',
      '\\(\\begin{bmatrix} -2 \\\\ 3 \\\\ 1 \\end{bmatrix}\\)',
      '\\(\\begin{bmatrix} 1 \\\\ 0 \\\\ 0 \\end{bmatrix}\\)'
    ],
    answer: 2,
    explain: 'Từ RREF: \\(x_1 + 2x_3 = 0,\\; x_2 - 3x_3 = 0\\). Đặt \\(x_3 = t\\) → \\(x_1 = -2t,\\; x_2 = 3t\\). Vector cơ sở: \\(\\begin{bmatrix} -2 \\\\ 3 \\\\ 1 \\end{bmatrix}\\). Kiểm tra: \\(A\\begin{bmatrix} -2 \\\\ 3 \\\\ 1 \\end{bmatrix} = \\begin{bmatrix} -2+0+2 \\\\ 0+3-3 \\end{bmatrix} = \\begin{bmatrix} 0 \\\\ 0 \\end{bmatrix}\\) ✓.'
  },
  {
    category: 'medium', tag: 'Trung bình', tagClass: 'tag-medium',
    text: 'Ma trận \\(A\\) (\\(3 \\times 4\\)) có RREF = \\(\\begin{bmatrix} 1 & 0 & -1 & 2 \\\\ 0 & 1 & 3 & -1 \\\\ 0 & 0 & 0 & 0 \\end{bmatrix}\\). Số vector độc lập tuyến tính tối thiểu cần để sinh \\(\\ker(A)\\) là:',
    options: ['1', '2', '3', '4'],
    answer: 1,
    explain: 'Có 4 cột, 2 pivot → 2 biến tự do (\\(x_3, x_4\\)). Vậy \\(\\dim(\\ker A) = 2\\), cần 2 vector độc lập tuyến tính để sinh \\(\\ker(A)\\).'
  },

  // ===== 3 BÀI TẬP KHÓ =====
  {
    category: 'hard', tag: 'Khó', tagClass: 'tag-hard',
    text: 'Cho \\(A = \\begin{bmatrix} 1 & 3 & 5 & 3 & 0 \\\\ 2 & 1 & 0 & 1 & 1 \\\\ 1 & 2 & 3 & 2 & -2 \\end{bmatrix}\\) (ma trận trong bài giảng). Sau bước khử đầu tiên, hàng 2 trở thành \\([0,\\; 5,\\; 10,\\; 5,\\; -1]\\). Phép biến đổi nào đã được thực hiện?',
    options: [
      '\\(H_2 \\leftarrow H_2 - 2H_1\\)',
      '\\(H_2 \\leftarrow 2H_1 - H_2\\)',
      '\\(H_2 \\leftarrow H_2 - H_1\\)',
      '\\(H_2 \\leftarrow H_1 - 2H_2\\)'
    ],
    answer: 1,
    explain: 'Theo bài giảng: "nhân dòng đầu với 2 rồi trừ dòng thứ hai" → \\(H_2^{\\text{mới}} = 2H_1 - H_2\\).<br>Kiểm tra: \\(2[1,3,5,3,0] - [2,1,0,1,1] = [0,\\; 5,\\; 10,\\; 5,\\; -1]\\) ✓. Đáp án <strong>B</strong>.'
  },
  {
    category: 'hard', tag: 'Khó', tagClass: 'tag-hard',
    text: 'Với ma trận \\(A\\) ở câu trên (\\(3 \\times 5\\)), sau khi tìm được RREF, biết pivot ở cột 1, 2, 4. Phát biểu nào <strong>SAI</strong>?',
    options: [
      '\\(\\text{Im}(A) = \\text{span}\\) của cột 1, 2, 4 của ma trận \\(A\\) ban đầu',
      '\\(\\text{rank}(A) = 3\\)',
      '\\(\\dim(\\ker A) = 2\\)',
      '\\(\\text{Im}(A) = \\text{span}\\) của cột 1, 2, 4 của ma trận RREF'
    ],
    answer: 3,
    explain: 'Câu D sai vì các phép biến đổi hàng <strong>làm thay đổi không gian cột</strong>. \\(\\text{Im}(A)\\) phải lấy từ cột của ma trận <em>\\(A\\) ban đầu</em>, không phải RREF. Các câu A, B, C đều đúng.'
  },
  {

    text: 'Cho \\(A = \\begin{bmatrix} 1 & 2 & 0 & 1 \\\\ 0 & 0 & 1 & 3 \\\\ 2 & 4 & 1 & 5 \\end{bmatrix}\\). Tìm cơ sở của \\(\\ker(A)\\) và \\(\\text{Im}(A)\\).',
    options: [

      '\\(\\ker\\): \\(\\left\\{ \\begin{bmatrix} 2 \\\\ -1 \\\\ 0 \\\\ 0 \\end{bmatrix} \\right\\}\\); \\(\\text{Im}\\): {cột 1, cột 2, cột 3 của \\(A\\)}',
      '\\(\\ker\\): \\(\\left\\{ \\begin{bmatrix} -2 \\\\ 1 \\\\ -3 \\\\ 0 \\end{bmatrix} \\right\\}\\); \\(\\text{Im}\\): {cột 1, cột 3 của \\(A\\)}',
      '\\(\\ker\\): \\(\\left\\{ \\begin{bmatrix} -2 \\\\ 1 \\\\ 0 \\\\ 0 \\end{bmatrix}, \\begin{bmatrix} 1 \\\\ 0 \\\\ 3 \\\\ -1 \\end{bmatrix} \\right\\}\\); \\(\\text{Im}\\): {cột 1, cột 2, cột 3 của \\(A\\)}'
    ],
    answer: 0,
    explain: 'RREF: \\(H_3 \\leftarrow H_3 - 2H_1 - H_2 = [0,0,0,0]\\). Pivot ở cột 1, 3. Biến tự do: \\(x_2, x_4\\).<br>• Đặt \\(x_2=s,\\; x_4=t\\) → \\(x_1 = -2s - t,\\; x_3 = -3t\\).<br>• Vector cơ sở \\(\\ker\\): \\(s\\begin{bmatrix} -2 \\\\ 1 \\\\ 0 \\\\ 0 \\end{bmatrix} + t\\begin{bmatrix} -1 \\\\ 0 \\\\ -3 \\\\ 1 \\end{bmatrix}\\) ✓<br>• \\(\\text{Im}(A) = \\text{span}\\){cột 1, cột 3 của \\(A\\)} (vì pivot ở cột 1 và 3). Đáp án <strong>A</strong>.'
  }
];

let currentQ = 0;
let userAnswers = new Array(questions.length).fill(null);

function typesetMath() {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise().catch(err => console.log('MathJax error:', err));
  }
}

function renderQuestion() {
  const q = questions[currentQ];
  const area = document.getElementById('questionArea');
  let html = `<span class="question-tag ${q.tagClass}">${q.tag}</span>`;
  html += `<div class="question-text"><strong>Câu ${currentQ+1}:</strong> ${q.text}</div>`;
  html += `<div class="options">`;
  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    let cls = 'option';
    if (userAnswers[currentQ] !== null) {
      cls += ' disabled';
      if (i === q.answer) cls += ' correct';
      else if (i === userAnswers[currentQ]) cls += ' wrong';
    }
    html += `<div class="${cls}" onclick="selectAnswer(${i})" data-idx="${i}">
      <span class="letter">${letters[i]}</span>
      <span>${opt}</span>
    </div>`;
  });
  html += `</div>`;
  html += `<div class="explanation ${userAnswers[currentQ] !== null ? 'show' : ''}" id="explainBox">${q.explain}</div>`;
  area.innerHTML = html;
  typesetMath();
  updateStats();
}

function selectAnswer(idx) {
  if (userAnswers[currentQ] !== null) return;
  userAnswers[currentQ] = idx;
  renderQuestion();
}

function updateStats() {
  document.getElementById('qNum').textContent = `${currentQ+1}/${questions.length}`;
  const answered = userAnswers.filter(a => a !== null).length;
  const correct = userAnswers.filter((a,i) => a === questions[i].answer).length;
  const wrong = answered - correct;
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('progressFill').style.width = `${(answered/questions.length)*100}%`;
  document.getElementById('prevBtn').disabled = currentQ === 0;
  const allAnswered = userAnswers.every(a => a !== null);
  if (currentQ === questions.length - 1 && allAnswered) {
    document.getElementById('nextBtn').textContent = '🏁 Xem kết quả';
  } else {
    document.getElementById('nextBtn').textContent = 'Tiếp →';
  }
}

function nextQuestion() {
  const allAnswered = userAnswers.every(a => a !== null);
  if (currentQ === questions.length - 1 && allAnswered) {
    showResult();
    return;
  }
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  }
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
  }
}

function showResult() {
  document.getElementById('questionArea').style.display = 'none';
  document.querySelector('.nav-buttons').style.display = 'none';
  const rs = document.getElementById('resultScreen');
  rs.classList.add('show');
  const correct = userAnswers.filter((a,i) => a === questions[i].answer).length;
  document.getElementById('finalScore').textContent = correct;
  const pct = (correct/questions.length)*100;
  document.getElementById('scoreCircle').style.background = `conic-gradient(#4facfe 0deg, #4facfe ${pct*3.6}deg, #e9ecef ${pct*3.6}deg)`;
  let msg = '';
  if (pct >= 90) msg = '🌟 Xuất sắc! Bạn nắm rất vững kiến thức!';
  else if (pct >= 70) msg = '👍 Khá tốt! Ôn thêm phần sai là hoàn hảo.';
  else if (pct >= 50) msg = '💪 Khá ổn, cần luyện tập thêm bài tập khó.';
  else msg = '📚 Hãy xem lại lý thuyết và làm thêm bài tập nhé!';
  document.getElementById('finalMsg').textContent = msg;

  // Category summary
  const cats = {theory: {name: '📘 Lý thuyết', total: 0, correct: 0},
                easy: {name: '🟢 Bài tập Dễ', total: 0, correct: 0},
                medium: {name: '🟡 Bài tập Trung bình', total: 0, correct: 0},
                hard: {name: '🔴 Bài tập Khó', total: 0, correct: 0}};
  questions.forEach((q,i) => {
    cats[q.category].total++;
    if (userAnswers[i] === q.answer) cats[q.category].correct++;
  });
  let sumHtml = '<h3>📊 Thống kê theo nhóm</h3>';
  for (const k in cats) {
    const c = cats[k];
    sumHtml += `<div class="cat-row"><span>${c.name}</span><span><strong>${c.correct}/${c.total}</strong></span></div>`;
  }
  document.getElementById('categorySummary').innerHTML = sumHtml;
}

function resetQuiz() {
  currentQ = 0;
  userAnswers = new Array(questions.length).fill(null);
  document.getElementById('questionArea').style.display = 'block';
  document.querySelector('.nav-buttons').style.display = 'flex';
  document.getElementById('resultScreen').classList.remove('show');
  renderQuestion();
}

renderQuestion();
</script>
</body>
</html>
